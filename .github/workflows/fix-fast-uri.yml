name: Fix fast-uri security dependency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify fast-uri
        run: npm ls fast-uri --all

      - name: Commit lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/fix-fast-uri.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: update fast-uri lockfile"
          git push
